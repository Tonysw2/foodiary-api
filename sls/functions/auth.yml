signUp:
  handler: src/main/functions/auth/sign-up.handler
  environment: ${file(./sls/config/env.yml)}
  events:
    - httpApi:
        path: /auth/sign-up
        method: POST

signIn:
  handler: src/main/functions/auth/sign-in.handler
  environment: ${file(./sls/config/env.yml)}
  events:
    - httpApi:
        path: /auth/sign-in
        method: POST

refreshToken:
  handler: src/main/functions/auth/refresh-token.handler
  environment: ${file(./sls/config/env.yml)}
  events:
    - httpApi:
        path: /auth/refresh-token
        method: POST

preSignUp:
  handler: src/main/functions/auth/pre-sign-up.handler
  events:
    - cognitoUserPool:
        pool: ${self:custom.cognito.PoolName}
        trigger: PreSignUp
        existing: true
        forceDeploy: true

# The trigger was configured manually to support event V2
# Look at UserPool.yml for trigger config
# Do not change this function name without change in the cognito.yml
preTokenGenerationTrigger:
  handler: src/main/functions/auth/pre-token-generation.handler
