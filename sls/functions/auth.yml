signUp:
  handler: src/main/functions/auth/sign-up.handler
  environment: ${file(./sls/env.yml)}
  events:
    - httpApi:
        path: /auth/sign-up
        method: POST

preSignUp:
  handler: src/main/functions/auth/pre-sign-up.handler
  events:
    - cognitoUserPool:
        pool: ${self:custom.cognito.PoolName}
        trigger: PreSignUp
        existing: true
        forceDeploy: true
