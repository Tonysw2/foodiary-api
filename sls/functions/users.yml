getMe:
  handler: src/main/functions/users/get-me.handler
  environment: ${file(./sls/config/env.yml)}
  events:
    - httpApi:
        method: GET
        path: /users/me
        authorizer:
          name: cognitoAuthorizer

updateProfile:
  handler: src/main/functions/users/update-profile.handler
  environment: ${file(./sls/config/env.yml)}
  events:
    - httpApi:
        method: PUT
        path: /users/profile
        authorizer:
          name: cognitoAuthorizer
