createMeal:
  handler: src/main/functions/meals/create-meal.handler
  environment: ${file(./sls/config/env.yml)}
  events:
    - httpApi:
        method: POST
        path: /meals
        authorizer:
          name: cognitoAuthorizer

listMealsByDay:
  handler: src/main/functions/meals/list-meals-by-day.handler
  environment: ${file(./sls/config/env.yml)}
  events:
    - httpApi:
        method: GET
        path: /meals
        authorizer:
          name: cognitoAuthorizer

getMeal:
  handler: src/main/functions/meals/get-meal.handler
  environment: ${file(./sls/config/env.yml)}
  events:
    - httpApi:
        method: GET
        path: /meals/{mealId}
        authorizer:
          name: cognitoAuthorizer

handleMealUpload:
  handler: src/main/functions/meals/handle-meal-upload.handler
  environment: ${file(./sls/config/env.yml)}
  events:
    - s3:
        bucket: ${self:service}-${self:provider.stage}-meals-bucket-${aws:accountId}
        event: s3:ObjectCreated:*
        existing: true
