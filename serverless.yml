org: anthonysorg
service: foodiary-api

provider:
  name: aws
  region: us-east-1
  runtime: nodejs24.x
  memorySize: 128
  stage: ${opt:stage, 'dev'}
  iam:
    role: ${file(./sls/config/iam.yml)}
  httpApi:
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !GetAtt UserPool.ProviderURL
        audience:
          - !Ref UserPoolClient

package:
  individually: true

custom:
  cognito:
    PoolName: ${self:service}-${self:provider.stage}-UserPool

build:
  esbuild:
    configFile: ./esbuild.config.mjs

functions:
  - ${file(./sls/functions/auth.yml)}
  - ${file(./sls/functions/meals.yml)}
  - ${file(./sls/functions/users.yml)}

resources:
  - ${file(./sls/resources/cognito.yml)}
  - ${file(./sls/resources/main-table.yml)}
  - ${file(./sls/resources/meals-bucket.yml)}
  - ${file(./sls/resources/meals-bucket-cdn.yml)}
  - ${file(./sls/resources/meals-queue.yml)}
